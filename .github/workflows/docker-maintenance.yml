# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs
# =============================================================================
# Every Dependabot PR reaches this workflow (no paths filter), so each one gets
# an explicit decision and annotation instead of silently staying open. The
# reusable workflow merges a PR only after docker-release.yml has run on the
# PR head commit and passed; it builds the image from app/linkstack/.
#
#   docker          app/linkstack/Dockerfile - built by docker-release.yml
#   docker-compose  docker-compose*.yml only reference our own image with an
#                   interpolated tag, which Dependabot does not update. Note:
#                   docker-release.yml only validates compose files, it does
#                   not start them - do not add third-party images there
#                   without a PR test that runs them.
#   github-actions  left open by the reusable workflow (a CI change), as is
#                   every PR touching .github/ - merge those by hand
#
# See automation-templates docs/workflows/docker-maintenance.md.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the image.
      required-workflows: '.github/workflows/docker-release.yml'
    secrets: inherit
