name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose*.yml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  attestations: write
  id-token: write
  actions: read

jobs:
  # ============================================
  # Validation Jobs
  # ============================================

  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.coolify.yml", "docker-compose.traefik.yml", "docker-compose.development.yml"]'
      env-file: '.env.example'
      validate-services: '["linkstack"]'

  # ============================================
  # Build Gate (every event - nothing is pushed)
  # ============================================
  # Builds the image from this run's commit before anything is released: on
  # a PR it is the CI docker-maintenance.yml waits for, on a push or a
  # dispatch (the release after a Dependabot merge) it keeps a commit whose
  # image does not build from being tagged as a version without an image.

  docker-build-linkstack-validate:
    name: 🔨 Validate linkstack Build
    needs: [validate-compose]
    if: needs.validate-compose.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-LinkStack/linkstack'

      auto-tags: true
      dockerfile-path: './app/linkstack/Dockerfile'
      docker-context: './app/linkstack'
      platforms: 'linux/amd64,linux/arm64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # Release Job (push / dispatch, after the gate)
  # ============================================
  # semantic-release publishes from main only (branches: main), so a dispatch
  # on any other branch releases nothing and every publish job is skipped.

  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, docker-build-linkstack-validate]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.docker-build-linkstack-validate.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      # Release the commit this run validated and built - the image job below
      # builds it too. Without it the release takes the tip of main when it
      # starts: a push that landed during the gate would be released untested
      # and missing from the image. Pinned, semantic-release publishes nothing
      # once main has moved on, and the run for the newer main releases both.
      ref: ${{ github.sha }}
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ============================================
  # Docker Build & Push (linkstack, only after a release)
  # ============================================

  docker-build-linkstack-release:
    name: 🐳 Build & Push linkstack
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-LinkStack/linkstack'
      docker-image-name: 'bauergroup/cs-linkstack'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './app/linkstack/Dockerfile'
      docker-context: './app/linkstack'
      platforms: 'linux/amd64,linux/arm64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit
